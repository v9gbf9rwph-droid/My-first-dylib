name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & SDKs
        run: |
          mkdir -p ~/theos
          curl -L https://github.com | tar -xJ -C ~/theos --strip-components=1 || git clone --depth=1 --recursive https://github.com ~/theos
          curl -L https://github.com -o sdks.zip
          unzip -q sdks.zip
          mkdir -p ~/theos/sdks
          cp -r sdks-master/*.sdk ~/theos/sdks/

      - name: Compile Dylib
        run: |
          export THEOS=~/theos
          make
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Dylib
          path: output/*.dylib
