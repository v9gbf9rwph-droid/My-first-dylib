name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com ~/theos
          curl -LO https://github.com
          unzip master.zip
          mv sdks-master/*.sdk ~/theos/sdks/

      - name: Compile Dylib
        run: |
          export THEOS=~/theos
          make package
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Dylib
          path: output/*.dylib
